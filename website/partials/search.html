<dialog class="site-search" aria-labelledby="site-search-title" data-docs-url="{{DOCS_URL}}">
  <h2 id="site-search-title" class="sr-only">Search docs and guides</h2>
  <div class="search-input-wrap">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
    <input type="search" role="combobox" aria-label="Search documentation" placeholder="Search docs and guides" aria-expanded="true" aria-controls="doc-search-results" aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <button class="search-close" type="button" aria-label="Close search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <p class="search-status sr-only" role="status"></p>
  <div class="search-content">
    <div class="search-results" id="doc-search-results" role="listbox" aria-label="Documentation results"></div>
    <aside class="search-preview" aria-label="Selected documentation preview">
      <div class="search-print" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15" stroke-linejoin="round"/></svg>
      </div>
      <p class="search-preview-group"></p>
      <h3 class="search-preview-title"></h3>
      <p class="search-preview-description"></p>
      <a class="search-preview-link" href="{{DOCS_URL}}/docs">Open in docs <span aria-hidden="true">↗</span></a>
    </aside>
  </div>
  <p class="search-empty" hidden></p>
  <div class="search-footer">
    <span><kbd>↑</kbd> <kbd>↓</kbd> move <kbd>↵</kbd> open <kbd>esc</kbd> close</span>
    <a href="{{DOCS_URL}}/docs">Browse docs <span aria-hidden="true">↗</span></a>
  </div>
  <template id="search-document-icon">
    <span class="search-print" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15" stroke-linejoin="round"/></svg>
    </span>
  </template>
</dialog>
