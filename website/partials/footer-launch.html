<section class="launch" aria-labelledby="footer-start-title">
  <div class="wrap launch-content">
    <div class="launch-intro">
      <h2 id="footer-start-title">Make the blueprint yours.</h2>
      <p>Get set-me-up running on your next machine.</p>
    </div>
    {{FOOTER_SETUP_PANEL}}
    <div class="forest-scenes" role="group" aria-label="Footer scenery">
      <span>Change scenery</span>
      <button type="button" data-forest-scene="jungle-falls" aria-pressed="true">Jungle falls</button>
      <button type="button" data-forest-scene="misty-forest" aria-pressed="false">Misty forest</button>
      <button type="button" data-forest-scene="alpine-dawn" aria-pressed="false">Alpine dawn</button>
    </div>
  </div>
  <div class="launch-art" data-ascii-scene>
    <img src="/hero-glyphs.svg" width="1440" height="560" alt="" loading="lazy">
    <canvas data-ascii-rest="jungle-falls" data-forest-gallery role="img" aria-label="Jungle falls ASCII landscape">Waterfalls surrounded by lush jungle foliage.</canvas>
  </div>
</section>
